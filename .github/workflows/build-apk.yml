name: Construire l'application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK de partage (installable directement sur un téléphone)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p sortie
          cp app/build/outputs/apk/debug/app-debug.apk sortie/JeuxBibliques-partage.apk

      - name: Préparer la clé de signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Versions signées (APK et AAB pour le Play Store)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk sortie/JeuxBibliques-signe.apk
          cp app/build/outputs/bundle/release/app-release.aab sortie/JeuxBibliques-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: JeuxBibliques-android
          path: sortie/
